[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utterplan"
dynamic = ["version"]
description = "Engine-independent text-to-speech planning compiler and interchange format"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Holger Nahrstaedt", email = "nahrstaedt@gmail.com"}]
keywords = ["tts", "text-to-speech", "ssmd", "speech markup"]
dependencies = [
  "phrasplit>=0.3.9,<0.4",
  "ssmd>=0.9.0,<0.10",
  "spokenform>=0.4.3,<0.5",
  "typing_extensions>=4.0",
 ]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Text Processing :: Linguistic",
 ]

[project.urls]
Homepage = "https://github.com/buchwandler/utterplan"
Repository = "https://github.com/buchwandler/utterplan"

[project.scripts]
utterplan = "utterplan.cli:main"

[project.optional-dependencies]
dev = ["build", "jsonschema", "mypy", "pytest", "ruff"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "myst-parser>=2.0"]
spacy = ["spacy>=3.5,<4"]
[tool.setuptools.packages.find]
include = ["utterplan*"]

[tool.setuptools.package-data]
utterplan = ["py.typed", "utterplan.schema.json", "schemas/*.schema.json"]

[tool.setuptools_scm]
version_file = "utterplan/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["reference: requires the sibling PyKokoro checkout"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
