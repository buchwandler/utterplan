    observed_behavior:
      Serialized plans gain a v2 schema that embeds token annotations
      with lemma, pos, tag, and morph fields plus linguistic run records carrying provider,
      model, provider_version, and model_version provenance. Unit content hashes move
      to the utterplan-unit-v2 payload that includes tokens. A registered v1-to-v2 migration
      upgrades older files and the schema registry keeps v1 frozen. pyproject gains
      a spacy optional extra. The inspect token view and detailed explain output report
      provider and model provenance and per-segment tokens.
