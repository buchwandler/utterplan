    observed_behavior:
      Added a manifest-driven bundle lifecycle that accepts canonical
      .ssmd-bundle roots, validates safe book or document manifests, selects book items
      by source number, and provides unified compile, RenderPlan projection, and deterministic
      replan services. The CLI and public Python API dispatch behavior from manifest.json,
      keep source content and manifests read-only, and write independent plans, profile
      variants, reports, and replan updates under bundle-owned output directories.
