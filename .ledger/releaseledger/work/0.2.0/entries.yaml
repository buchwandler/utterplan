  - kind: fixed
    summary:
      Fixed runnable examples with command-line arguments, path-safe outputs,
      and a dedicated SSMD example script
    body:
      Example scripts expose main() entry points with argparse interfaces, resolve
      default paths next to the script instead of the current working directory, and
      write generated plans beside the source. examples/ssmd.py is replaced by examples/ssmd_example.py,
      examples/chapter.ssmd provides sample SSMD input, and generated examples/*.utterplan.json
      outputs are excluded from git.
    status: accepted
