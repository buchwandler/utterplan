  - kind: changed
    summary:
      Improved inspect and explain output with token annotations and linguistic
      run metadata
    body:
      The inspect token view reports provider and model provenance alongside per-token
      lemma, pos, tag, and morph values. Detailed explain output lists each segment's
      tokens and the linguistic run information behind them.
    status: accepted
