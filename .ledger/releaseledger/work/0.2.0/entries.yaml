entries:
  - kind: added
    summary:
      Added schema version 2 with embedded token annotations, linguistic run provenance,
      and a v1-to-v2 migration
    body:
      Serialized plans can now be written as schema version 2, which embeds token
      annotations with lemma, pos, tag, and morph fields and records linguistic run provenance
      (provider, model, provider version, model version). Unit content hashes move to
      the utterplan-unit-v2 payload that includes tokens. Older v1 files upgrade through
      the registered v1-to-v2 migration while v1 stays frozen, and spaCy support is available
      through the spacy optional extra.
    status: accepted
    source_refs:
      - git:c52aa684cc872d348d90972001a8c5194ae7c7f8
