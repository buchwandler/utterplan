  - kind: fixed
    summary: Fixed precedence so authored SSMD breaks override generated pauses
    body: >-
      At a shared boundary, an explicit SSMD break wins over automatic or default
      pauses. Durations are not added, all contributing event IDs remain in provenance,
      and an authored zero-duration break still takes precedence.
    status: accepted
    paths:
      - utterplan/pauses.py
      - tests/test_pauses.py
      - tests/test_ssmd_09_parser.py
    sources:
      - tl:task-0017

  - kind: changed
    summary: Changed Python input defaults and renamed SSMDConfig options
    body: >-
      PlannerConfig now treats strings as plain text unless SSMD is selected explicitly.
      The no-op strict_header and unknown_header options were removed; parse_header and
      the application pause_defaults option are now parse_yaml_header and pause_overrides.
      The source-header pause_defaults key remains unchanged.
    status: accepted
    breaking: true
    paths:
      - utterplan/config.py
      - utterplan/parsers.py
      - utterplan/planner.py
      - docs/python-api.md
      - docs/consumer-guide.md
      - tests/test_consumer_readiness.py
    sources:
      - tl:task-0017

  - kind: changed
    summary: Changed clause enrichment to reuse provider-owned spaCy docs
    body: >-
      Clausal-boundary enrichment reuses the request-local provider document when
      available. Fallback analysis does not infer syntactic clauses, and sentence
      topology remains on the deterministic spaCy-free segmentation path.
    status: accepted
    paths:
      - utterplan/planner.py
      - tests/test_linguistics.py
    sources:
      - tl:task-0017

  - kind: added
    summary: Added PEP 561 metadata and SSMD 0.9 package checks
    body: >-
      Wheel and source-distribution checks require the PEP 561 marker, all schema
      resources, and the SSMD 0.9 dependency range. Installed-package smoke coverage
      accepts strict 0.9 input and rejects an explicit 0.8 header.
    status: accepted
    paths:
      - utterplan/py.typed
      - pyproject.toml
      - .github/workflows/tests.yml
      - .github/workflows/python-publish.yml
    sources:
      - tl:task-0017

  - kind: docs
    summary: Documented the 0.2-to-0.3 migration paths
    body: >-
      The migration guide separates SSMD source conversion with ssmd migrate from
      UtterPlan JSON schema migration. It documents the plain Python input default,
      SSMDConfig renames, and continued v1/v2 plan migration to schema v3.
    status: accepted
    paths:
      - docs/consumer-guide.md
      - docs/python-api.md
      - docs/format.md
    sources:
      - tl:task-0017
