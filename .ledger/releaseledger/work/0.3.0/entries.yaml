    summary: Changed source compatibility to SSMD 0.9 with typed schema v3 plans
    body: >-
      SSMD input uses dialect 0.9 and older source syntax is rejected. Schema v3
      preserves typed renderer-neutral directives and source provenance; supported
      v1 and v2 plans migrate to v3 without reparsing or replanning.
